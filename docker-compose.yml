services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: product_db
      MYSQL_ROOT_PASSWORD: Password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    depends_on:
      - mysql
    environment:
      SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Password
      JWT_SECRET: change-this-development-secret-key-to-a-long-random-value
      JWT_ACCESS_EXPIRATION: 900000
      JWT_REFRESH_EXPIRATION: 604800000
    ports:
      - "9090:9090"

volumes:
  mysql_data:
